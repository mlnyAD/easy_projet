

<form
    method="get"
    action="{% url 'risks:list' %}"
    class="ep-list-filter-form"
>
    <input
        type="hidden"
        name="sort"
        value="{{ sort_by }}"
    >
    <input
        type="hidden"
        name="direction"
        value="{% if sort_descending %}desc{% else %}asc{% endif %}"
    >
    <input
        type="hidden"
        name="page_size"
        value="{{ request.GET.page_size }}"
    >

    {% if is_project_context %}
        <input
            type="hidden"
            name="project"
            value="{{ project.pk }}"
        >
    {% endif %}

    <span class="ep-list-filters-title">
        Filtres
    </span>

    {% if not is_project_context %}
        <label class="ep-list-filter">
            <span>Projet</span>

            <select
                name="project"
                class="ep-list-filter-select"
                aria-label="Filtrer les risques par projet"
                onchange="this.form.submit()"
            >
                <option value="">Tous</option>

                {% for project in filter_projects %}
                    <option
                        value="{{ project.pk }}"
                        {% if project.pk|stringformat:"s" == project_filter %}
                            selected
                        {% endif %}
                    >
                        {{ project.reference }} — {{ project.name }}
                    </option>
                {% endfor %}
            </select>
        </label>
    {% endif %}

    <label class="ep-list-filter">
        <span>Type</span>

        <select
            name="risk_type"
            class="ep-list-filter-select"
            aria-label="Filtrer les risques par type"
            onchange="this.form.submit()"
        >
            <option value="">Tous</option>

            {% for risk_type in filter_risk_types %}
                <option
                    value="{{ risk_type.pk }}"
                    {% if risk_type.pk|stringformat:"s" == risk_type_filter|stringformat:"s" %}
                        selected
                    {% endif %}
                >
                    {{ risk_type.label }}
                </option>
            {% endfor %}
        </select>
    </label>

    <label class="ep-list-filter">
        <span>Pilote</span>

        <select
            name="owner"
            class="ep-list-filter-select"
            aria-label="Filtrer les risques par pilote"
            onchange="this.form.submit()"
        >
            <option value="">Tous</option>

            {% for owner in filter_owners %}
                <option
                    value="{{ owner.pk }}"
                    {% if owner.pk|stringformat:"s" == owner_filter %}
                        selected
                    {% endif %}
                >
                    {{ owner.last_name }} {{ owner.first_name }}
                </option>
            {% endfor %}
        </select>
    </label>

    <label class="ep-list-filter">
        <span>Criticité</span>

        <select
            name="criticality"
            class="ep-list-filter-select"
            aria-label="Filtrer les risques par criticité"
            onchange="this.form.submit()"
        >
            <option value="">Toutes</option>

            {% for criticality in filter_criticalities %}
                <option
                    value="{{ criticality.pk }}"
                    {% if criticality.pk|stringformat:"s" == criticality_filter|stringformat:"s" %}
                        selected
                    {% endif %}
                >
                    {{ criticality.label }}
                </option>
            {% endfor %}
        </select>
    </label>

    <label class="ep-list-filter">
        <span>État</span>

        <select
            name="status"
            class="ep-list-filter-select"
            aria-label="Filtrer les risques par état"
            onchange="this.form.submit()"
        >
            <option value="">Tous</option>

            {% for status in filter_statuses %}
                <option
                    value="{{ status.pk }}"
                    {% if status.pk|stringformat:"s" == status_filter|stringformat:"s" %}
                        selected
                    {% endif %}
                >
                    {{ status.label }}
                </option>
            {% endfor %}
        </select>
    </label>

    <label class="ep-list-filter">
        <span>Actif</span>

        <select
            name="activity"
            class="ep-list-filter-select"
            aria-label="Filtrer les risques actifs"
            onchange="this.form.submit()"
        >
            <option
                value="all"
                {% if risk_activity == "all" %}selected{% endif %}
            >
                Tous
            </option>
            <option
                value="active"
                {% if risk_activity == "active" %}selected{% endif %}
            >
                Actifs
            </option>
            <option
                value="inactive"
                {% if risk_activity == "inactive" %}selected{% endif %}
            >
                Inactifs
            </option>
        </select>
    </label>
</form>
