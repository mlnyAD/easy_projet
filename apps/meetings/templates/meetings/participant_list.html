

{% extends "layout/base.html" %}

{% block title %}
    Participants — {{ meeting.reference }}
{% endblock %}

{% block content %}
    <div class="space-y-4">

        <div class="flex flex-wrap items-center justify-between gap-4">

            <div>
                <h1
                    class="text-xl font-semibold
                           text-axcio-text
                           dark:text-axcio-text-dark"
                >
                    Participants de la réunion
                </h1>

                <p
                    class="mt-1 text-sm
                           text-axcio-text-muted
                           dark:text-axcio-text-muted-dark"
                >
                    {{ meeting.reference }}
                    — {{ meeting.subject }}
                </p>
            </div>

            <div class="flex flex-wrap items-center gap-2">

                <a
                    href="{{ parent_return_url }}"
                    class="inline-flex items-center gap-2 rounded-lg
                           border border-axcio-border
                           bg-axcio-surface-alt px-4 py-2
                           text-sm font-medium
                           text-axcio-text-secondary
                           transition-colors
                           hover:bg-axcio-border-light
                           focus:outline-none focus:ring-2
                           focus:ring-axcio-light
                           dark:border-axcio-border-dark
                           dark:bg-axcio-surface-alt-dark
                           dark:text-axcio-text-secondary-dark
                           dark:hover:bg-axcio-border-dark"
                >
                    <i
                        data-lucide="arrow-left"
                        class="h-4 w-4"
                        aria-hidden="true"
                    ></i>

                    Retour aux réunions
                </a>

                <a
                    href="{% url 'meetings:participant-create' meeting.pk %}?next={{ return_url|urlencode }}"
                    class="inline-flex items-center justify-center
                           rounded-lg bg-axcio-light px-4 py-2
                           text-sm font-medium text-white
                           transition-colors
                           hover:bg-axcio-light-hover
                           focus:outline-none focus:ring-2
                           focus:ring-axcio-light
                           focus:ring-offset-2
                           dark:focus:ring-offset-axcio-page-dark"
                >
                    Ajouter un participant
                </a>

            </div>
        </div>

        {% include "edf/list/list.html" %}

    </div>
{% endblock %}
