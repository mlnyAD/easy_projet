

<form
    method="get"
    action="{% url 'meetings:list' %}"
    class="ep-list-filter-form"
>
    <input
        type="hidden"
        name="sort"
        value="{{ sort_by }}"
    >
    <input
        type="hidden"
        name="direction"
        value="{% if sort_descending %}desc{% else %}asc{% endif %}"
    >
    <input
        type="hidden"
        name="page_size"
        value="{{ request.GET.page_size }}"
    >

    {% if is_project_context %}
        <input
            type="hidden"
            name="project"
            value="{{ project.pk }}"
        >
    {% endif %}

    <span class="ep-list-filters-title">
        Filtres
    </span>

    {% if not is_project_context %}
        <label class="ep-list-filter">
            <span>Projet</span>

            <select
                name="project"
                class="ep-list-filter-select"
                aria-label="Filtrer les réunions par projet"
                onchange="this.form.submit()"
            >
                <option value="">Tous</option>

                {% for project in filter_projects %}
                    <option
                        value="{{ project.pk }}"
                        {% if project.pk|stringformat:"s" == project_filter %}
                            selected
                        {% endif %}
                    >
                        {{ project.reference }} — {{ project.name }}
                    </option>
                {% endfor %}
            </select>
        </label>
    {% endif %}

    <label class="ep-list-filter">
        <span>Organisateur</span>

        <select
            name="organizer"
            class="ep-list-filter-select"
            aria-label="Filtrer les réunions par organisateur"
            onchange="this.form.submit()"
        >
            <option value="">Tous</option>

            {% for organizer in filter_organizers %}
                <option
                    value="{{ organizer.pk }}"
                    {% if organizer.pk|stringformat:"s" == organizer_filter %}
                        selected
                    {% endif %}
                >
                    {{ organizer.last_name }} {{ organizer.first_name }}
                </option>
            {% endfor %}
        </select>
    </label>

    <label class="ep-list-filter">
        <span>État</span>

        <select
            name="status"
            class="ep-list-filter-select"
            aria-label="Filtrer les réunions par état"
            onchange="this.form.submit()"
        >
            <option value="">Tous</option>

            {% for status in filter_statuses %}
                <option
                    value="{{ status.pk }}"
                    {% if status.pk|stringformat:"s" == status_filter|stringformat:"s" %}
                        selected
                    {% endif %}
                >
                    {{ status.label }}
                </option>
            {% endfor %}
        </select>
    </label>

    <label class="ep-list-filter">
        <span>Invitations</span>

        <select
            name="invitations"
            class="ep-list-filter-select"
            aria-label="Filtrer les réunions selon les invitations"
            onchange="this.form.submit()"
        >
            <option
                value="all"
                {% if meeting_invitations == "all" %}selected{% endif %}
            >
                Toutes
            </option>
            <option
                value="sent"
                {% if meeting_invitations == "sent" %}selected{% endif %}
            >
                Envoyées
            </option>
            <option
                value="pending"
                {% if meeting_invitations == "pending" %}selected{% endif %}
            >
                À envoyer
            </option>
        </select>
    </label>

    <label class="ep-list-filter">
        <span>Active</span>

        <select
            name="activity"
            class="ep-list-filter-select"
            aria-label="Filtrer les réunions actives"
            onchange="this.form.submit()"
        >
            <option
                value="all"
                {% if meeting_activity == "all" %}selected{% endif %}
            >
                Toutes
            </option>
            <option
                value="active"
                {% if meeting_activity == "active" %}selected{% endif %}
            >
                Actives
            </option>
            <option
                value="inactive"
                {% if meeting_activity == "inactive" %}selected{% endif %}
            >
                Inactives
            </option>
        </select>
    </label>
</form>
