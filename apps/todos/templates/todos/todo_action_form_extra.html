

<script>
    document.addEventListener(
        "DOMContentLoaded",
        () => {
            const origin = document.getElementById(
                "{{ form.origin.id_for_label }}"
            );

            const recipients = document.querySelector(
                '[data-ep-form-collection="recipients"]'
            );

            if (!origin || !recipients) {
                return;
            }

            function updateRecipientsVisibility() {
                recipients.classList.toggle(
                    "hidden",
                    origin.value !== "ASSIGNED"
                );
            }

            origin.addEventListener(
                "change",
                updateRecipientsVisibility
            );

            updateRecipientsVisibility();
        }
    );
</script>
