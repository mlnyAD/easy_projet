

{% if row.source_object.can_manage %}

    <a
        href="{% url 'todos:update' row.source_object.pk %}?next={{ request.get_full_path|urlencode }}"
        class="ep-list-row-action"
        title="Modifier"
        aria-label="Modifier l’action"
    >
        <i
            data-lucide="pen"
            class="ep-list-row-action-icon"
            aria-hidden="true"
        ></i>
    </a>

    <form
        method="post"
        action="{% url 'todos:delete' row.source_object.pk %}"
        class="inline"
        onsubmit="return confirm(
            'Supprimer définitivement cette action ?'
        );"
    >
        {% csrf_token %}

        <input
            type="hidden"
            name="next"
            value="{{ request.get_full_path }}"
        >

        <button
            type="submit"
            class="
                ep-list-row-action text-red-600
                hover:bg-red-50
                dark:text-red-400
                dark:hover:bg-red-950/30
            "
            title="Supprimer"
            aria-label="Supprimer l’action"
        >
            <i
                data-lucide="trash-2"
                class="ep-list-row-action-icon"
                aria-hidden="true"
            ></i>
        </button>
    </form>

{% endif %}
