

<div class="ep-list-row-actions">

    <a
        href="{% url 'tasks:list-by-work-package' row.source_object.pk %}"
        class="ep-list-row-action"
        title="Afficher les tâches"
        aria-label="Afficher les tâches du lot"
    >
        <i
            data-lucide="list-checks"
            class="ep-list-row-action-icon"
            aria-hidden="true"
        ></i>
    </a>

    <a
        href="{% url 'work:update' row.source_object.pk %}?next={{ return_url|urlencode }}"
        class="ep-list-row-action"
        title="Modifier"
        aria-label="Modifier le lot de travaux"
    >
        <i
            data-lucide="pen"
            class="ep-list-row-action-icon"
            aria-hidden="true"
        ></i>
    </a>

</div>
