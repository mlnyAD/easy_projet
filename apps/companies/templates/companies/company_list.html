

{% extends "base.html" %}

{% block title %}Sociétés{% endblock %}

{% block content %}

<div class="space-y-6">

    {# En-tête de la page #}
    <div
        class="flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between"
    >
        <div>
            <h1
                class="text-2xl font-semibold text-gray-800
                       dark:text-white"
            >
                Sociétés
            </h1>

            <p
                class="mt-1 text-sm text-gray-500
                       dark:text-neutral-400"
            >
                Gestion des sociétés enregistrées dans Easy Projet.
            </p>
        </div>

        <div>
            <a
                href="{% url 'companies:create' %}"
                class="inline-flex items-center gap-x-2 rounded-lg
                       border border-transparent bg-blue-600 px-4 py-3
                       text-sm font-medium text-white
                       hover:bg-blue-700
                       focus:outline-none focus:bg-blue-700
                       disabled:pointer-events-none disabled:opacity-50"
            >
                Nouvelle société
            </a>
        </div>
    </div>

    {# Liste générique fournie par le framework #}
    {% include "components/lists/ep_list.html" %}

</div>

{% endblock %}
