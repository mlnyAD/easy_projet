

{% load static %}

<aside
    id="planning-ai-panel"
    class="ep-communication-panel ep-planning-ai-panel"
    aria-label="Assistant IA de planification"
    aria-hidden="true"
    data-planning-ai-panel
    data-analysis-url="{% url 'planning:ai-analysis' %}"
>
    <div
        class="
            flex h-full flex-col
        "
    >
        <header
            class="
                flex items-center justify-between gap-3
                border-b px-4 py-3
                border-axcio-border-light
                dark:border-axcio-border-dark
            "
        >
            <div>
                <h2 class="font-semibold">
                    Assistant IA
                </h2>

                <p
                    class="
                        text-xs text-axcio-text-muted
                        dark:text-axcio-text-muted-dark
                    "
                >
                    Analyse et recommandations de planning
                </p>
            </div>

            <div class="flex items-center gap-1">
                <button
                    id="planning-ai-pin-button"
                    type="button"
                    class="
                        rounded-md p-2
                        hover:bg-axcio-surface-alt
                        dark:hover:bg-axcio-surface-alt-dark
                    "
                    title="Épingler le panneau"
                    aria-label="Épingler le panneau"
                    aria-pressed="false"
                >
                    <i
                        data-lucide="pin"
                        class="h-4 w-4"
                        aria-hidden="true"
                    ></i>
                </button>

                <button
                    id="planning-ai-close-button"
                    type="button"
                    class="
                        rounded-md p-2
                        hover:bg-axcio-surface-alt
                        dark:hover:bg-axcio-surface-alt-dark
                    "
                    title="Fermer"
                    aria-label="Fermer l'assistant IA"
                >
                    <i
                        data-lucide="x"
                        class="h-4 w-4"
                        aria-hidden="true"
                    ></i>
                </button>
            </div>
        </header>

        <div
            id="planning-ai-messages"
            class="flex-1 space-y-3 overflow-y-auto p-4"
            aria-live="polite"
        >
            <div
                class="
                    rounded-lg border p-3 text-sm
                    border-axcio-border-light
                    bg-axcio-surface-alt
                    dark:border-axcio-border-dark
                    dark:bg-axcio-surface-alt-dark
                "
            >
                Sélectionnez un projet, puis demandez une analyse
                ou posez une question sur son planning.
            </div>
        </div>

        <form
            id="planning-ai-form"
            class="
                border-t p-4
                border-axcio-border-light
                dark:border-axcio-border-dark
            "
        >
            {% csrf_token %}

            <label
                for="planning-ai-question"
                class="mb-1 block text-sm font-medium"
            >
                Votre demande
            </label>

            <textarea
                id="planning-ai-question"
                rows="3"
                maxlength="1500"
                placeholder="Ex. Quelles surcharges doivent être traitées en priorité ?"
                class="
                    w-full resize-none rounded-md border px-3 py-2 text-sm
                    border-axcio-border-light
                    bg-white
                    dark:border-axcio-border-dark
                    dark:bg-axcio-surface-dark
                "
            ></textarea>

            <div class="mt-3 flex items-center justify-between gap-3">
                <p
                    class="
                        text-xs text-axcio-text-muted
                        dark:text-axcio-text-muted-dark
                    "
                >
                    L’IA formule des propositions ; elle ne modifie
                    jamais le planning.
                </p>

                <button
                    id="planning-ai-submit-button"
                    type="submit"
                    class="
                        shrink-0 rounded-md px-3 py-2 text-sm font-medium
                        text-white transition-colors
                    "
                    style="background-color: #0D5262;"
                    onmouseover="this.style.backgroundColor='#1E7477'"
                    onmouseout="this.style.backgroundColor='#0D5262'"
                >
                    Analyser
                </button>
            </div>
        </form>
    </div>
</aside>
