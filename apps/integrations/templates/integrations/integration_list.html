

{% extends "layout/base.html" %}

{% block title %}
Intégrations externes
{% endblock %}

{% block content %}

<div>
    <div class="flex items-center justify-between gap-4">

        <div>
            <h1
                class="text-xl font-semibold
                       text-axcio-text
                       dark:text-axcio-text-dark"
            >
                Intégrations externes
            </h1>

            <p
                class="mt-1 text-sm
                       text-axcio-text-muted
                       dark:text-axcio-text-muted-dark"
            >
                Applications et services externes disponibles
                dans les environnements clients.
            </p>
        </div>

        <a
            href="{% url 'integrations:create' %}?next={{ return_url|urlencode }}"
            class="inline-flex items-center justify-center
                   rounded-lg bg-axcio-light px-4 py-2
                   text-sm font-medium text-white
                   transition-colors
                   hover:bg-axcio-light-hover
                   focus:outline-none focus:ring-2
                   focus:ring-axcio-light
                   focus:ring-offset-2
                   dark:focus:ring-offset-axcio-page-dark"
        >
            Nouvelle intégration
        </a>

    </div>

    {% include "edf/list/list.html" %}

</div>

{% endblock %}
