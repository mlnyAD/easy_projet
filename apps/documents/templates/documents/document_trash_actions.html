

<form
    method="post"
    action="{% url 'documents:document-restore' project.pk row.source_object.pk %}"
    class="inline"
>
    {% csrf_token %}

    <input
        type="hidden"
        name="next"
        value="{{ request.get_full_path }}"
    >

    <button
        type="submit"
        class="ep-list-row-action"
        title="Restaurer"
        aria-label="Restaurer {{ row.source_object.title }}"
    >
        <i
            data-lucide="rotate-ccw"
            class="ep-list-row-action-icon"
            aria-hidden="true"
        ></i>
    </button>
</form>

{% if can_permanently_delete_document %}
    <form
        method="post"
        action="{% url 'documents:document-permanent-delete' project.pk row.source_object.pk %}"
        class="inline"
        onsubmit="return confirm(
            'Supprimer définitivement ce document et toutes ses versions ?'
        );"
    >
        {% csrf_token %}

        <input
            type="hidden"
            name="next"
            value="{{ request.get_full_path }}"
        >

        <button
            type="submit"
            class="
                ep-list-row-action text-red-600
                hover:bg-red-50 dark:text-red-400
                dark:hover:bg-red-950/30
            "
            title="Supprimer définitivement"
            aria-label="Supprimer définitivement {{ row.source_object.title }}"
        >
            <i
                data-lucide="trash-2"
                class="ep-list-row-action-icon"
                aria-hidden="true"
            ></i>
        </button>
    </form>
{% endif %}
