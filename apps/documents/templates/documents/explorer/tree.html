

<aside
    class="min-w-0 overflow-auto border-r
           border-axcio-border-light
           bg-axcio-page
           p-2
           text-axcio-text
           dark:border-axcio-border-dark
           dark:bg-axcio-page-dark
           dark:text-axcio-text-dark"
>
    <button
        type="button"
        id="root-create-folder"
        class="flex h-8 w-full items-center gap-2
               rounded-md px-2 text-left text-sm font-medium
               text-axcio-dark
               hover:bg-axcio-surface-alt
               dark:text-axcio-light
               dark:hover:bg-axcio-surface-alt-dark"
    >
        <i
            data-lucide="folder-plus"
            class="h-4 w-4 shrink-0"
            aria-hidden="true"
        ></i>

        <span class="truncate">
            Insérer un répertoire
        </span>
    </button>

    <div
        class="my-2 border-t
               border-axcio-border-light
               dark:border-axcio-border-dark"
    ></div>

    <div>
        {% for folder in root_folders %}

            {% include "documents/explorer/folder_tree_node.html" with folder=folder %}

        {% empty %}

            <p
                class="px-2 py-3 text-xs
                       text-axcio-text-muted
                       dark:text-axcio-text-muted-dark"
            >
                Aucun répertoire.
            </p>

        {% endfor %}
    </div>
</aside>
