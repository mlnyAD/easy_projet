

<div
    id="folder-context-menu"
    class="fixed z-50 hidden min-w-52
           rounded-lg border
           border-axcio-border-light
           bg-axcio-page py-1 shadow-lg
           dark:border-axcio-border-dark
           dark:bg-axcio-page-dark"
>
    <button
        type="button"
        data-folder-action="create"
        class="flex w-full items-center gap-2
               px-3 py-2 text-left text-sm
               text-axcio-text
               hover:bg-axcio-surface-alt
               dark:text-axcio-text-dark
               dark:hover:bg-axcio-surface-alt-dark"
    >
        <i
            data-lucide="folder-plus"
            class="h-4 w-4"
        ></i>

        Nouveau répertoire
    </button>

    <button
        type="button"
        data-folder-action="rename"
        class="flex w-full items-center gap-2
               px-3 py-2 text-left text-sm
               text-axcio-text
               hover:bg-axcio-surface-alt
               dark:text-axcio-text-dark
               dark:hover:bg-axcio-surface-alt-dark"
    >
        <i
            data-lucide="pencil"
            class="h-4 w-4"
        ></i>

        Renommer
    </button>

    <button
        type="button"
        data-folder-action="move"
        class="flex w-full items-center gap-2
               px-3 py-2 text-left text-sm
               text-axcio-text
               hover:bg-axcio-surface-alt
               dark:text-axcio-text-dark
               dark:hover:bg-axcio-surface-alt-dark"
    >
        <i
            data-lucide="folder-input"
            class="h-4 w-4"
        ></i>

        Déplacer
    </button>

    <button
        type="button"
        disabled
        title="Fonction à venir"
        class="flex w-full cursor-not-allowed items-center gap-2
               px-3 py-2 text-left text-sm italic
               text-axcio-text-muted opacity-50
               dark:text-axcio-text-muted-dark"
    >
        <i
            data-lucide="copy"
            class="h-4 w-4"
        ></i>

        Copier
    </button>

    <div
        class="my-1 border-t
               border-axcio-border-light
               dark:border-axcio-border-dark"
    ></div>

    <button
        type="button"
        data-folder-action="delete"
        class="flex w-full items-center gap-2
               px-3 py-2 text-left text-sm
               text-red-600
               hover:bg-red-50
               dark:hover:bg-red-950/30"
    >
        <i
            data-lucide="trash-2"
            class="h-4 w-4"
        ></i>

        Supprimer
    </button>
</div>
