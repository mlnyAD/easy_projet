

<div
    id="folder-context-menu"
    class="fixed z-50 hidden min-w-52
           rounded-lg border border-gray-200
           bg-white py-1 shadow-lg
           dark:border-gray-700
           dark:bg-gray-900"
>
    <button
        type="button"
        data-folder-action="create"
        class="flex w-full items-center gap-2
               px-3 py-2 text-left text-sm
               hover:bg-gray-100
               dark:hover:bg-gray-800"
    >
        <i
            data-lucide="folder-plus"
            class="h-4 w-4"
        ></i>

        Nouveau répertoire
    </button>

    <button
        type="button"
        id="content-import-document"
        class="flex w-full items-center gap-2
            px-3 py-2 text-left text-sm
            text-axcio-text
            hover:bg-axcio-surface-alt
            dark:text-axcio-text-dark
            dark:hover:bg-axcio-surface-alt-dark"
    >
        <i
            data-lucide="upload"
            class="h-4 w-4"
        ></i>

        Importer un PDF
    </button>

    <button
        type="button"
        data-folder-action="rename"
        class="flex w-full items-center gap-2
               px-3 py-2 text-left text-sm
               hover:bg-gray-100
               dark:hover:bg-gray-800"
    >
        <i
            data-lucide="pencil"
            class="h-4 w-4"
        ></i>

        Renommer
    </button>

    <div
        class="my-1 border-t border-gray-200
               dark:border-gray-700"
    ></div>

    <button
        type="button"
        data-folder-action="delete"
        class="flex w-full items-center gap-2
               px-3 py-2 text-left text-sm
               text-red-600
               hover:bg-red-50
               dark:hover:bg-red-950/30"
    >
        <i
            data-lucide="trash-2"
            class="h-4 w-4"
        ></i>

        Supprimer
    </button>
</div>

<div
    id="content-context-menu"
    class="fixed z-50 hidden min-w-52
           rounded-lg border
           border-axcio-border-light
           bg-axcio-page py-1 shadow-lg
           dark:border-axcio-border-dark
           dark:bg-axcio-page-dark"
>
    <button
        type="button"
        id="content-create-folder"
        class="flex w-full items-center gap-2
               px-3 py-2 text-left text-sm
               text-axcio-text
               hover:bg-axcio-surface-alt
               dark:text-axcio-text-dark
               dark:hover:bg-axcio-surface-alt-dark"
    >
        <i
            data-lucide="folder-plus"
            class="h-4 w-4"
        ></i>

        Nouveau répertoire
    </button>
</div>

<div
    id="document-context-menu"
    class="fixed z-50 hidden min-w-52
           rounded-lg border
           border-axcio-border-light
           bg-axcio-page py-1 shadow-lg
           dark:border-axcio-border-dark
           dark:bg-axcio-page-dark"
>
    <button
        type="button"
        data-document-action="open"
        class="flex w-full items-center gap-2
               px-3 py-2 text-left text-sm
               hover:bg-axcio-surface-alt
               dark:hover:bg-axcio-surface-alt-dark"
    >
        <i
            data-lucide="external-link"
            class="h-4 w-4"
        ></i>

        Ouvrir
    </button>

    <button
        type="button"
        data-document-action="download"
        class="flex w-full items-center gap-2
               px-3 py-2 text-left text-sm
               hover:bg-axcio-surface-alt
               dark:hover:bg-axcio-surface-alt-dark"
    >
        <i
            data-lucide="download"
            class="h-4 w-4"
        ></i>

        Télécharger
    </button>
    
    <button
        type="button"
        data-document-action="rename"
        class="flex w-full items-center gap-2
            px-3 py-2 text-left text-sm
            hover:bg-axcio-surface-alt
            dark:hover:bg-axcio-surface-alt-dark"
    >
        <i
            data-lucide="pencil"
            class="h-4 w-4"
        ></i>

        Renommer
    </button>
    <button
        type="button"
        data-document-action="copy"
        class="flex w-full items-center gap-2
            px-3 py-2 text-left text-sm
            hover:bg-axcio-surface-alt
            dark:hover:bg-axcio-surface-alt-dark"
    >
        <i
            data-lucide="copy"
            class="h-4 w-4"
        ></i>

        Copier
    </button>
    <button
        type="button"
        data-document-action="move"
        class="flex w-full items-center gap-2
            px-3 py-2 text-left text-sm
            hover:bg-axcio-surface-alt
            dark:hover:bg-axcio-surface-alt-dark"
    >
        <i
            data-lucide="folder-input"
            class="h-4 w-4"
        ></i>

        Déplacer
    </button>
    <div
        class="my-1 border-t
            border-axcio-border-light
            dark:border-axcio-border-dark"
    ></div>

    <button
        type="button"
        data-document-action="favorite"
        class="flex w-full items-center gap-2
            px-3 py-2 text-left text-sm
            hover:bg-axcio-surface-alt
            dark:hover:bg-axcio-surface-alt-dark"
    >
        <i
            data-document-favorite-icon
            data-lucide="star"
            class="h-4 w-4"
        ></i>

        <span data-document-favorite-label>
            Ajouter aux favoris
        </span>
    </button>


    <div
        class="my-1 border-t
            border-axcio-border-light
            dark:border-axcio-border-dark"
    ></div>

    <button
        type="button"
        data-document-action="delete"
        class="flex w-full items-center gap-2
            px-3 py-2 text-left text-sm
            text-red-600
            hover:bg-red-50
            dark:hover:bg-red-950/30"
    >
        <i
            data-lucide="trash-2"
            class="h-4 w-4"
        ></i>

        Supprimer
    </button>
</div>
<div
    class="my-1 border-t
           border-axcio-border-light
           dark:border-axcio-border-dark"
></div>
