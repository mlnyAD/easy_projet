

<div>

    <a
        href="{% url 'documents:folder' project.pk folder.pk %}"

        data-folder-context
        data-folder-id="{{ folder.pk }}"
        data-folder-name="{{ folder.name }}"
        data-folder-create-url="{% url 'documents:folder-create' project.pk %}"
        data-folder-rename-url="{% url 'documents:folder-rename' project.pk folder.pk %}"
        data-folder-delete-url="{% url 'documents:folder-delete' project.pk folder.pk %}"
        data-folder-move-url="{% url 'documents:folder-move' project.pk folder.pk %}"
        data-folder-doe-url="{% url 'documents:folder-doe-selection' project.pk folder.pk %}?next={{ return_url|urlencode }}"

        {% if folder.is_doe %}
            data-folder-is-doe="true"
        {% else %}
            data-folder-is-doe="false"
        {% endif %}

        {% if folder.is_doe_root or folder.is_doe_generated %}
            data-folder-doe-protected="true"
        {% else %}
            data-folder-doe-protected="false"
        {% endif %}

        class="
            flex h-8 items-center gap-2
            rounded-md px-2 text-sm

            {% if current_folder and folder.pk == current_folder.pk %}
                bg-axcio-light
                text-white
                font-medium
                hover:bg-axcio-light
                dark:bg-axcio-light
                dark:text-white
                dark:hover:bg-axcio-light
            {% else %}
                text-axcio-text
                hover:bg-axcio-surface-alt
                dark:text-axcio-text-dark
                dark:hover:bg-axcio-surface-alt-dark
            {% endif %}
        "
    >
        {% if folder.children.all %}
            <i
                data-lucide="{% if folder.pk in open_folder_ids %}chevron-down{% else %}chevron-right{% endif %}"
                class="
                    h-3.5 w-3.5 shrink-0
                    {% if current_folder and folder.pk == current_folder.pk %}
                        text-current
                    {% else %}
                        text-axcio-text-muted
                        dark:text-axcio-text-muted-dark
                    {% endif %}
                "
            ></i>
        {% else %}
            <span class="w-3.5 shrink-0"></span>
        {% endif %}

        <i
            data-lucide="{% if folder.pk in open_folder_ids %}folder-open{% else %}folder{% endif %}"
            class="
                h-4 w-4 shrink-0
                {% if current_folder and folder.pk == current_folder.pk %}
                    text-current
                {% else %}
                    text-axcio-text
                    dark:text-axcio-text-dark
                {% endif %}
            "
        ></i>

        <span class="truncate">
            {{ folder.name }}
        </span>
    </a>

    {% if folder.pk in open_folder_ids %}

        <div style="margin-left: 24px;">

            {% for child in folder.children.all %}

                {% if child.is_active %}

                    {% include "documents/explorer/folder_tree_node.html" with folder=child %}

                {% endif %}

            {% endfor %}

        </div>

    {% endif %}

</div>
