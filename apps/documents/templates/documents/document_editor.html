

{% extends "layout/base.html" %}


{% block title %}
{{ document.title }}
{% endblock %}


{% block content %}

<div class="flex h-[calc(100vh-7rem)] flex-col">

    <div
        class="mb-3 flex items-center justify-between gap-4"
    >
        <div class="min-w-0">
            <h1
                class="truncate text-lg font-semibold
                       text-axcio-text
                       dark:text-axcio-text-dark"
            >
                {{ document.title }}
            </h1>

            <p
                class="text-sm
                       text-axcio-text-muted
                       dark:text-axcio-text-muted-dark"
            >
                Version {{ version.version_number }}
                —
                {{ version.original_filename }}
            </p>
        </div>
    </div>

    <div
        id="onlyoffice-editor"
        class="min-h-0 flex-1 overflow-hidden rounded-lg
               border border-axcio-border-light
               dark:border-axcio-border-dark"
    ></div>

</div>


{{ onlyoffice_config|json_script:"onlyoffice-config" }}

<script
    src="{{ onlyoffice_api_url }}"
></script>

<script>
    document.addEventListener(
        "DOMContentLoaded",
        function () {
            const configElement =
                document.getElementById(
                    "onlyoffice-config"
                );

            if (!configElement) {
                console.error(
                    "Configuration ONLYOFFICE introuvable."
                );
                return;
            }

            if (
                typeof DocsAPI === "undefined"
            ) {
                console.error(
                    "API ONLYOFFICE non chargée."
                );
                return;
            }

            const config = JSON.parse(
                configElement.textContent
            );

            new DocsAPI.DocEditor(
                "onlyoffice-editor",
                config
            );
        }
    );
</script>

{% endblock %}
