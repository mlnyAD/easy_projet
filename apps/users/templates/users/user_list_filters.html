

<form
    method="get"
    action="{% url 'users:list' %}"
    class="ep-list-filter-form"
>
    {% if sort_by %}
        <input
            type="hidden"
            name="sort"
            value="{{ sort_by }}"
        >
    {% endif %}

    <input
        type="hidden"
        name="direction"
        value="{% if sort_descending %}desc{% else %}asc{% endif %}"
    >

    {% if request.GET.page_size %}
        <input
            type="hidden"
            name="page_size"
            value="{{ request.GET.page_size }}"
        >
    {% endif %}

    <span class="ep-list-filters-title">
        Filtres
    </span>

    <label
        for="user-company-filter"
        class="ep-list-filter-label"
    >
        Société
    </label>

    <select
        id="user-company-filter"
        name="company"
        class="ep-list-filter-select"
        aria-label="Filtrer les contacts par société"
        onchange="this.form.submit()"
    >
        <option value="">
            Toutes
        </option>

        {% for company in filter_companies %}

            <option
                value="{{ company.pk }}"
                {% if company.pk|stringformat:"s" == company_filter %}
                    selected
                {% endif %}
            >
                {{ company.name }}
            </option>

        {% endfor %}
    </select>

    <label
        for="user-activity-filter"
        class="ep-list-filter-label"
    >
        Actif
    </label>

    <select
        id="user-activity-filter"
        name="activity"
        class="ep-list-filter-select"
        aria-label="Filtrer les contacts selon leur activité"
        onchange="this.form.submit()"
    >
        <option
            value="all"
            {% if user_activity == "all" %}
                selected
            {% endif %}
        >
            Tous
        </option>

        <option
            value="active"
            {% if user_activity == "active" %}
                selected
            {% endif %}
        >
            Oui
        </option>

        <option
            value="inactive"
            {% if user_activity == "inactive" %}
                selected
            {% endif %}
        >
            Non
        </option>
    </select>

</form>
