

<script>
document.addEventListener("DOMContentLoaded", () => {

    const tabInput = document.querySelector(
        "#id_active_tab"
    );

    const tabs = document.querySelectorAll(
        "[data-project-tab]"
    );

    const panels = document.querySelectorAll(
        "[data-project-panel]"
    );


    // =============================================================
    // Onglets
    // =============================================================

    function activateTab(name) {

        tabs.forEach((tab) => {

            const active = (
                tab.dataset.projectTab === name
            );

            tab.classList.toggle(
                "border-axcio-light",
                active
            );

            tab.classList.toggle(
                "text-axcio-light",
                active
            );

            tab.classList.toggle(
                "border-transparent",
                !active
            );

            tab.classList.toggle(
                "text-axcio-text-secondary",
                !active
            );

        });


        panels.forEach((panel) => {

            panel.classList.toggle(
                "hidden",
                panel.dataset.projectPanel !== name
            );

        });


        if (tabInput) {
            tabInput.value = name;
        }
    }


    tabs.forEach((tab) => {

        tab.addEventListener(
            "click",
            () => {
                activateTab(
                    tab.dataset.projectTab
                );
            }
        );

    });


    activateTab(
        tabInput?.value || "project"
    );


    // =============================================================
    // Ajout dynamique d'une ligne de formset
    // =============================================================

    function addFormRow(prefix) {

        const container = document.querySelector(
            `[data-formset="${prefix}"]`
        );

        const template = document.querySelector(
            `[data-empty-form="${prefix}"]`
        );

        const totalForms = document.querySelector(
            `#id_${prefix}-TOTAL_FORMS`
        );


        if (
            !container
            || !template
            || !totalForms
        ) {
            return;
        }


        const index = Number(
            totalForms.value
        );


        const html = template.innerHTML.replaceAll(
            "__prefix__",
            index
        );


        container.insertAdjacentHTML(
            "beforeend",
            html
        );


        totalForms.value = index + 1;


        if (window.lucide) {
            window.lucide.createIcons();
        }

    }


    document
        .querySelectorAll("[data-add-row]")
        .forEach((button) => {

            button.addEventListener(
                "click",
                () => {

                    addFormRow(
                        button.dataset.addRow
                    );

                }
            );

        });


    // =============================================================
    // Suppression
    // =============================================================

    document.addEventListener(
        "click",
        (event) => {

            const button = event.target.closest(
                "[data-delete-row]"
            );


            if (!button) {
                return;
            }


            const row = button.closest(
                "[data-form-row]"
            );


            if (!row) {
                return;
            }


            const deleteInput = row.querySelector(
                'input[name$="-DELETE"]'
            );


            if (deleteInput) {
                deleteInput.checked = true;
            }


            row.classList.add(
                "hidden"
            );

        }
    );

});
</script>
