<script>
document.addEventListener("DOMContentLoaded", () => {

    const tabInput = document.querySelector(
        "#id_active_tab"
    );

    const tabs = document.querySelectorAll(
        "[data-project-tab]"
    );

    const panels = document.querySelectorAll(
        "[data-project-panel]"
    );

    const usersDataElement = document.getElementById(
        "project-users-data"
    );

    const users = usersDataElement
        ? JSON.parse(usersDataElement.textContent)
        : [];

    const usersById = new Map(
        users.map(
            (user) => [
                String(user.id),
                user,
            ]
        )
    );


    // =============================================================
    // Onglets
    // =============================================================

    function activateTab(name) {

        tabs.forEach((tab) => {

            const active = (
                tab.dataset.projectTab === name
            );

            tab.classList.toggle(
                "border-axcio-light",
                active
            );

            tab.classList.toggle(
                "text-axcio-light",
                active
            );

            tab.classList.toggle(
                "border-transparent",
                !active
            );

            tab.classList.toggle(
                "text-axcio-text-secondary",
                !active
            );

        });


        panels.forEach((panel) => {

            panel.classList.toggle(
                "hidden",
                panel.dataset.projectPanel !== name
            );

        });


        if (tabInput) {
            tabInput.value = name;
        }
    }


    tabs.forEach((tab) => {

        tab.addEventListener(
            "click",
            () => {
                activateTab(
                    tab.dataset.projectTab
                );
            }
        );

    });


    activateTab(
        tabInput?.value || "project"
    );


    // =============================================================
    // Informations utilisateur
    // =============================================================

    function setUserField(
        row,
        fieldName,
        value
    ) {
        const field = row.querySelector(
            `[data-user-field="${fieldName}"]`
        );

        if (!field) {
            return;
        }

        field.textContent = value ?? "";
    }


    function clearUserFields(row) {

        [
            "last_name",
            "first_name",
            "email",
            "company",
            "global_role",
            "access_level",
        ].forEach(
            (fieldName) => {
                setUserField(
                    row,
                    fieldName,
                    ""
                );
            }
        );

    }


    function populateUserRow(
        row,
        userId
    ) {
        const user = usersById.get(
            String(userId)
        );

        if (!user) {
            clearUserFields(row);
            return;
        }

        setUserField(
            row,
            "last_name",
            user.last_name
        );

        setUserField(
            row,
            "first_name",
            user.first_name
        );

        setUserField(
            row,
            "email",
            user.email
        );

        setUserField(
            row,
            "company",
            user.company
        );

        setUserField(
            row,
            "global_role",
            user.global_role
        );

        setUserField(
            row,
            "access_level",
            user.access_level
        );
    }


    // =============================================================
    // Doublons utilisateurs
    // =============================================================

    function userAlreadySelected(
        currentSelect,
        userId
    ) {
        if (!userId) {
            return false;
        }

        const selects = document.querySelectorAll(
            '[data-formset="memberships"] select[name$="-user"]'
        );

        return Array.from(selects).some(
            (select) => {

                if (select === currentSelect) {
                    return false;
                }

                const row = select.closest(
                    "[data-form-row]"
                );

                const deleteInput = row?.querySelector(
                    'input[name$="-DELETE"]'
                );

                if (
                    deleteInput
                    && deleteInput.checked
                ) {
                    return false;
                }

                return (
                    String(select.value)
                    === String(userId)
                );
            }
        );
    }


    function configureMembershipRow(row) {

        if (!row) {
            return;
        }

        const select = row.querySelector(
            'select[name$="-user"]'
        );

        if (!select) {
            return;
        }

        if (select.dataset.userConfigured === "1") {
            return;
        }

        select.dataset.userConfigured = "1";


        select.addEventListener(
            "change",
            () => {

                const userId = select.value;

                if (
                    userAlreadySelected(
                        select,
                        userId
                    )
                ) {
                    window.alert(
                        "Cet utilisateur est déjà affecté au projet."
                    );

                    select.value = "";

                    clearUserFields(row);

                    return;
                }

                populateUserRow(
                    row,
                    userId
                );

            }
        );


        if (select.value) {
            populateUserRow(
                row,
                select.value
            );
        }

    }


    document
        .querySelectorAll("[data-membership-row]")
        .forEach(
            configureMembershipRow
        );


    // =============================================================
    // Ajout dynamique d'une ligne
    // =============================================================

    function addFormRow(prefix) {

        const container = document.querySelector(
            `[data-formset="${prefix}"]`
        );

        const template = document.querySelector(
            `[data-empty-form="${prefix}"]`
        );

        const totalForms = document.querySelector(
            `#id_${prefix}-TOTAL_FORMS`
        );


        if (
            !container
            || !template
            || !totalForms
        ) {
            return;
        }


        const index = Number(
            totalForms.value
        );


        const html = template.innerHTML.replaceAll(
            "__prefix__",
            index
        );


        container.insertAdjacentHTML(
            "beforeend",
            html
        );


        totalForms.value = index + 1;


        const rows = container.querySelectorAll(
            "[data-form-row]"
        );

        const newRow = rows[
            rows.length - 1
        ];


        if (
            prefix === "memberships"
            && newRow
        ) {
            configureMembershipRow(
                newRow
            );
        }


        if (window.lucide) {
            window.lucide.createIcons();
        }

    }


    document
        .querySelectorAll("[data-add-row]")
        .forEach((button) => {

            button.addEventListener(
                "click",
                () => {

                    addFormRow(
                        button.dataset.addRow
                    );

                }
            );

        });


    // =============================================================
    // Suppression
    // =============================================================

    document.addEventListener(
        "click",
        (event) => {

            const button = event.target.closest(
                "[data-delete-row]"
            );


            if (!button) {
                return;
            }


            const row = button.closest(
                "[data-form-row]"
            );


            if (!row) {
                return;
            }


            const deleteInput = row.querySelector(
                'input[name$="-DELETE"]'
            );


            if (deleteInput) {
                deleteInput.checked = true;
            }


            row.classList.add(
                "hidden"
            );

        }
    );

});
</script>
