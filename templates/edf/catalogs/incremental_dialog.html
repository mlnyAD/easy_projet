

<div
    id="catalog-incremental-dialog"
    class="fixed inset-0 z-50 hidden items-center justify-center
           bg-black/30 p-4"
    data-catalog-increment-dialog
    data-create-url="{% url 'catalogs:incremental-create' %}"
    aria-hidden="true"
>
    <div
        class="w-full max-w-md rounded-xl border border-gray-200
               bg-white p-6 shadow-xl
               dark:border-neutral-700 dark:bg-neutral-900"
        role="dialog"
        aria-modal="true"
        aria-labelledby="catalog-incremental-title"
    >
        <div class="flex items-start justify-between gap-4">
            <div>
                <h2
                    id="catalog-incremental-title"
                    class="text-lg font-semibold text-gray-900
                           dark:text-neutral-100"
                >
                    Nouvelle valeur
                </h2>

                <p
                    class="mt-1 text-sm text-gray-500
                           dark:text-neutral-400"
                    data-catalog-dialog-code
                ></p>
            </div>

            <button
                type="button"
                class="inline-flex h-8 w-8 items-center justify-center
                       rounded-md text-gray-500
                       hover:bg-gray-100 hover:text-gray-800
                       focus:outline-none focus:ring-2
                       focus:ring-axcio-light
                       dark:hover:bg-neutral-800
                       dark:hover:text-neutral-100"
                aria-label="Fermer"
                data-catalog-dialog-close
            >
                <span aria-hidden="true">×</span>
            </button>
        </div>

        <div class="mt-6 space-y-2">
            <label
                for="catalog-incremental-label"
                class="block text-sm font-medium text-gray-800
                       dark:text-neutral-200"
            >
                Libellé
                <span
                    class="text-red-600"
                    aria-hidden="true"
                >
                    *
                </span>
            </label>

            <input
                id="catalog-incremental-label"
                type="text"
                maxlength="100"
                autocomplete="off"
                class="block w-full rounded-lg border border-gray-300
                       bg-white px-3 py-2 text-sm text-gray-900 shadow-sm
                       transition
                       placeholder:text-gray-400
                       focus:border-axcio-dark
                       focus:outline-none focus:ring-2
                       focus:ring-axcio-dark/20
                       disabled:cursor-not-allowed
                       disabled:bg-gray-100
                       dark:border-neutral-700
                       dark:bg-neutral-900
                       dark:text-neutral-200
                       dark:placeholder:text-neutral-500"
                placeholder="Ex. : Peintre, Carreleur…"
                data-catalog-dialog-label
            >

            <p
                class="hidden text-sm text-red-600
                       dark:text-red-500"
                role="alert"
                data-catalog-dialog-error
            ></p>
        </div>

        <div class="mt-6 flex justify-end gap-3">
            <button
                type="button"
                class="inline-flex items-center justify-center
                       rounded-lg border border-gray-300
                       bg-white px-4 py-2
                       text-sm font-medium text-gray-700
                       transition-colors
                       hover:bg-gray-50
                       focus:outline-none focus:ring-2
                       focus:ring-gray-400 focus:ring-offset-2
                       dark:border-neutral-600
                       dark:bg-neutral-800
                       dark:text-neutral-100
                       dark:hover:bg-neutral-700"
                data-catalog-dialog-close
            >
                Annuler
            </button>

            <button
                type="button"
                class="inline-flex items-center justify-center
                       rounded-lg bg-axcio-light px-4 py-2
                       text-sm font-medium text-white
                       transition-colors
                       hover:bg-axcio-dark
                       focus:outline-none focus:ring-2
                       focus:ring-axcio-light focus:ring-offset-2
                       disabled:cursor-not-allowed
                       disabled:opacity-50"
                data-catalog-dialog-submit
                disabled
            >
                Créer
            </button>
        </div>
    </div>
</div>
