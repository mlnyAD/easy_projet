

<div
    id="catalog-incremental-dialog"
    class="ep-dialog-overlay"
    data-catalog-increment-dialog
    data-create-url="{% url 'catalogs:incremental-create' %}"
    aria-hidden="true"
>
    <div
        class="ep-dialog"
        role="dialog"
        aria-modal="true"
        aria-labelledby="catalog-incremental-title"
    >
        <div class="ep-dialog-header">

            <div>
                <h2
                    id="catalog-incremental-title"
                    class="ep-dialog-title"
                >
                    Nouvelle valeur
                </h2>

                <p
                    class="ep-dialog-subtitle"
                    data-catalog-dialog-code
                ></p>
            </div>

            <button
                type="button"
                class="ep-dialog-close"
                aria-label="Fermer"
                data-catalog-dialog-close
            >
                <span aria-hidden="true">×</span>
            </button>

        </div>


        <div class="ep-dialog-body">

            <div class="ep-field">

                <div class="ep-field-label-row">

                    <label
                        for="catalog-incremental-label"
                        class="ep-field-label"
                    >
                        Libellé

                        <span
                            class="ep-field-required"
                            aria-hidden="true"
                        >
                            *
                        </span>

                        <span class="sr-only">
                            Champ obligatoire
                        </span>
                    </label>

                </div>

                <input
                    id="catalog-incremental-label"
                    type="text"
                    maxlength="100"
                    autocomplete="off"
                    class="ep-input"
                    placeholder="Ex. : Peintre, Carreleur…"
                    data-catalog-dialog-label
                >

                <p
                    class="ep-dialog-error"
                    role="alert"
                    data-catalog-dialog-error
                    hidden
                ></p>

            </div>

        </div>


        <div class="ep-dialog-actions">

            <button
                type="button"
                class="ep-button ep-button-cancel"
                data-catalog-dialog-close
            >
                <span class="ep-button-label">
                    Annuler
                </span>
            </button>

            <button
                type="button"
                class="ep-button ep-button-execute"
                data-catalog-dialog-submit
                disabled
            >
                <span
                    class="ep-button-label"
                    data-catalog-dialog-submit-label
                >
                    Créer
                </span>
            </button>

        </div>

    </div>
</div>
