

{% load ep_lists %}

<tr
    class="transition-colors
           hover:bg-axcio-surface-alt
           dark:hover:bg-axcio-surface-alt-dark"
>
    {% for cell in row.cells %}
        <td
            class="
                {{ cell.column|column_width_class }}
                {{ cell.column|column_alignment_class }}
                px-4 py-1.5
                text-sm
                leading-5
                text-axcio-text-secondary
                dark:text-axcio-text-secondary-dark
                {% if cell.column.truncate %}
                    truncate whitespace-nowrap
                {% endif %}
            "
            {% if cell.column.truncate and cell.display_value %}
                title="{{ cell.display_value }}"
            {% endif %}
        >
            {{ cell.display_value }}
        </td>
    {% endfor %}

    {% if row_actions_template %}
        <td
            class="
                w-px
                whitespace-nowrap
                text-center
                px-4 py-1.5
            "
        >
            {% include row_actions_template %}
        </td>
    {% endif %}
</tr>
