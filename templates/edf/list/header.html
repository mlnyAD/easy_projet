

<thead class="bg-gray-50">
    <tr>
        {% for column in list_view.columns %}
            <th
                scope="col"
                class="px-6 py-3 text-left text-xs font-semibold uppercase
                       tracking-wider text-gray-500"
            >
                <span>{{ column.label }}</span>

                {% if column.sorted %}
                    {% if column.descending %}
                        <span aria-label="Tri décroissant">▼</span>
                    {% else %}
                        <span aria-label="Tri croissant">▲</span>
                    {% endif %}
                {% endif %}
            </th>
        {% endfor %}

        {% if row_actions_template %}
            <th
                scope="col"
                class="px-6 py-3 text-right text-xs font-semibold uppercase
                       tracking-wider text-gray-500"
            >
                Actions
            </th>
        {% endif %}
    </tr>
</thead>
