

{% load ep_lists %}

<thead class="bg-axcio-surface-alt dark:bg-axcio-surface-alt-dark">
    <tr>
        {% for column in list_view.columns %}
            <th
                scope="col"
                class="
                    {{ column|column_width_class }}
                    {{ column|column_alignment_class }}
                    whitespace-nowrap
                    px-4 py-2.5
                    text-xs
                    font-semibold
                    uppercase
                    tracking-wider
                    text-axcio-text-muted
                    dark:text-axcio-text-muted-dark
                "
            >
                <span>{{ column.label }}</span>

                {% if column.sorted %}
                    {% if column.descending %}
                        <span
                            class="ml-1 text-axcio-light"
                            aria-label="Tri décroissant"
                        >
                            ▼
                        </span>
                    {% else %}
                        <span
                            class="ml-1 text-axcio-light"
                            aria-label="Tri croissant"
                        >
                            ▲
                        </span>
                    {% endif %}
                {% endif %}
            </th>
        {% endfor %}

        {% if row_actions_template %}
            <th
                scope="col"
                class="
                    w-px
                    whitespace-nowrap
                    text-center
                    px-4 py-2.5
                    text-xs
                    font-semibold
                    uppercase
                    tracking-wider
                    text-axcio-text-muted
                    dark:text-axcio-text-muted-dark
                "
            >
                Actions
            </th>
        {% endif %}
    </tr>
</thead>
