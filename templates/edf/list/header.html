

{% load ep_lists %}

<thead class="ep-list-header">

    <tr>

        {% for column in list_view.columns %}

            <th
                scope="col"
                class="
                    ep-list-header-cell
                    {{ column|column_width_class }}
                    {{ column|column_alignment_class }}
                "
            >
                <span>
                    {{ column.label }}
                </span>

                {% if column.sorted %}
                    <span
                        class="ep-list-sort-indicator"
                        aria-label="{% if column.descending %}Tri décroissant{% else %}Tri croissant{% endif %}"
                    >
                        {% if column.descending %}
                            ▼
                        {% else %}
                            ▲
                        {% endif %}
                    </span>
                {% endif %}

            </th>

        {% endfor %}


        {% if row_actions_template %}

            <th
                scope="col"
                class="ep-list-header-cell ep-list-actions-header"
            >
                Actions
            </th>

        {% endif %}

    </tr>

</thead>
