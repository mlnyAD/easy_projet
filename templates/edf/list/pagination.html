

{% if list_view.pagination.total_pages > 1 %}
    <nav
        class="flex items-center justify-between"
        aria-label="Pagination"
    >
        <div class="min-w-32">
            {% if list_view.pagination.has_previous %}
                <a
                    href="?page={{ list_view.pagination.previous_page }}"
                    class="inline-flex items-center rounded-lg
                           bg-axcio-light
                           px-3 py-1.5
                           text-sm font-medium text-white
                           shadow-sm
                           transition-colors
                           hover:bg-axcio-light-hover
                           focus:outline-none
                           focus:ring-2
                           focus:ring-axcio-light
                           focus:ring-offset-2
                           dark:focus:ring-offset-axcio-page-dark"
                >
                    Page précédente
                </a>
            {% endif %}
        </div>

        <span
            class="text-sm
                   text-axcio-text-muted
                   dark:text-axcio-text-muted-dark"
        >
            Page {{ list_view.pagination.page }}
            sur {{ list_view.pagination.total_pages }}
        </span>

        <div class="flex min-w-32 justify-end">
            {% if list_view.pagination.has_next %}
                <a
                    href="?page={{ list_view.pagination.next_page }}"
                    class="inline-flex items-center rounded-lg
                           bg-axcio-light
                           px-3 py-1.5
                           text-sm font-medium text-white
                           shadow-sm
                           transition-colors
                           hover:bg-axcio-light-hover
                           focus:outline-none
                           focus:ring-2
                           focus:ring-axcio-light
                           focus:ring-offset-2
                           dark:focus:ring-offset-axcio-page-dark"
                >
                    Page suivante
                </a>
            {% endif %}
        </div>
    </nav>
{% endif %}
