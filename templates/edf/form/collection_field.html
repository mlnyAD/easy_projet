

{% if bound_field %}

    <div class="ep-form-collection-field">

        {{ bound_field }}

        {% if bound_field.errors %}

            <div
                id="{{ bound_field.auto_id }}_errors"
                class="ep-form-collection-field-errors"
                role="alert"
            >
                {% for error in bound_field.errors %}
                    <p>{{ error }}</p>
                {% endfor %}
            </div>

        {% endif %}

    </div>

{% endif %}
