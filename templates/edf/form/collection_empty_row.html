

{% load ep_form_fields %}

<template
    data-ep-empty-form="{{ collection.name }}"
>

    <tr
        class="ep-form-collection-row"
        data-ep-form-row
    >

        {% for hidden_field in collection.empty_row.django_form.hidden_fields %}
            {{ hidden_field }}
        {% endfor %}


        {% for cell in collection.empty_row.cells %}

            <td class="ep-form-collection-cell">

                {% if cell.bound_field %}

                    {% render_ep_collection_field cell.bound_field %}

                {% else %}

                    <span class="ep-form-collection-value"></span>

                {% endif %}

            </td>

        {% endfor %}


        {% if collection.allow_delete %}

            <td class="ep-form-collection-action-cell">

                {% if collection.empty_row.delete_field %}
                    <div class="hidden">
                        {{ collection.empty_row.delete_field }}
                    </div>
                {% endif %}

                <button
                    type="button"
                    class="ep-form-collection-delete"
                    data-ep-delete-row
                    title="{{ collection.delete_label }}"
                    aria-label="{{ collection.delete_label }}"
                >
                    <i
                        data-lucide="trash-2"
                        class="ep-form-collection-delete-icon"
                        aria-hidden="true"
                    ></i>
                </button>

            </td>

        {% endif %}

    </tr>

</template>
