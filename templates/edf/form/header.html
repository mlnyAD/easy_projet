

{% if form_view.title or form_view.subtitle %}

    <header class="ep-form-header">

        {% if form_view.title %}
            <h1 class="ep-form-title">
                {{ form_view.title }}
            </h1>
        {% endif %}

        {% if form_view.subtitle %}
            <p class="ep-form-subtitle">
                {{ form_view.subtitle }}
            </p>
        {% endif %}

    </header>

{% endif %}
