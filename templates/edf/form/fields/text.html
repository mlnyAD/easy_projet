

{% load ep_forms %}

{% if bound_field %}

    {% ep_form_field bound_field %}

{% elif standalone_id %}

    <div class="ep-field">

        <div class="ep-field-label-row">

            <label
                for="{{ standalone_id }}"
                class="ep-field-label"
            >
                {{ standalone_label }}

                {% if standalone_required %}
                    <span
                        class="ep-field-required"
                        aria-hidden="true"
                    >
                        *
                    </span>

                    <span class="sr-only">
                        Champ obligatoire
                    </span>
                {% endif %}
            </label>
        </div>

        <input
            id="{{ standalone_id }}"
            name="{{ standalone_name }}"
            type="{{ standalone_type|default:'text' }}"
            class="ep-input"
            {% if standalone_value %}
                value="{{ standalone_value }}"
            {% endif %}
            {% if standalone_maxlength %}
                maxlength="{{ standalone_maxlength }}"
            {% endif %}
            {% if standalone_placeholder %}
                placeholder="{{ standalone_placeholder }}"
            {% endif %}
            {% if standalone_autocomplete %}
                autocomplete="{{ standalone_autocomplete }}"
            {% endif %}
            {% if standalone_required %}
                required
            {% endif %}
            {% if standalone_readonly %}
                readonly
            {% endif %}
            {% if standalone_disabled %}
                disabled
            {% endif %}
        >

        {% if standalone_help_text %}
            <p class="ep-field-help">
                {{ standalone_help_text }}
            </p>
        {% endif %}
    </div>

{% elif field %}

    <div class="ep-field">

        <div class="ep-field-label-row">

            <label
                for="id_{{ field.name }}"
                class="ep-field-label"
            >
                {{ field.label }}

                {% if field.required %}
                    <span
                        class="ep-field-required"
                        aria-hidden="true"
                    >
                        *
                    </span>

                    <span class="sr-only">
                        Champ obligatoire
                    </span>
                {% endif %}
            </label>
        </div>

        <input
            id="id_{{ field.name }}"
            name="{{ field.name }}"
            type="text"
            class="ep-input"
            {% if field.required %}required{% endif %}
            {% if field.readonly %}readonly{% endif %}
            {% if field.disabled %}disabled{% endif %}
        >

        {% if field.help_text %}
            <p class="ep-field-help">
                {{ field.help_text }}
            </p>
        {% endif %}
    </div>

{% endif %}
