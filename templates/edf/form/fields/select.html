

{% load ep_forms %}

{% if bound_field %}

    <div
        data-catalog-field
        {% if field.catalog_code %}
            data-catalog-code="{{ field.catalog_code }}"
        {% endif %}
        data-catalog-editable="{{ field.catalog_is_editable|yesno:'true,false' }}"
        data-catalog-incremental="{{ field.catalog_is_incremental|yesno:'true,false' }}"
        data-catalog-allows-increment="{{ field.allows_catalog_increment|yesno:'true,false' }}"
    >
        <div class="flex items-end gap-2">
            <div class="flex-1">
                {% ep_form_field bound_field %}
            </div>

            {% if field.allows_catalog_increment %}
                <button
                    type="button"
                    class="inline-flex h-10 w-10 shrink-0 items-center
                           justify-center rounded-lg border
                           border-axcio-dark bg-axcio-light
                           text-xl font-medium text-white
                           transition-colors
                           hover:bg-axcio-light-hover
                           focus:outline-none focus:ring-2
                           focus:ring-axcio-light
                           focus:ring-offset-2
                           dark:focus:ring-offset-axcio-page-dark"
                    title="Ajouter une valeur"
                    aria-label="Ajouter une valeur"
                    data-catalog-increment-button
                    data-catalog-code="{{ field.catalog_code }}"
                    data-target-field="{{ field.id_for_label }}"
                >
                    <span aria-hidden="true">+</span>
                </button>
            {% endif %}
        </div>
    </div>

{% else %}

    <div class="space-y-2">
        <label
            for="id_{{ field.name }}"
            class="block text-sm font-medium
                   text-axcio-text-secondary
                   dark:text-axcio-text-secondary-dark"
        >
            {{ field.label }}

            {% if field.required %}
                <span
                    class="text-axcio-danger"
                    aria-hidden="true"
                >
                    *
                </span>

                <span class="sr-only">
                    Champ obligatoire
                </span>
            {% endif %}
        </label>

        <div class="flex items-end gap-2">
            <div class="flex-1">
                <select
                    id="id_{{ field.name }}"
                    name="{{ field.name }}"
                    class="
                        block w-full rounded-lg border
                        border-axcio-border
                        bg-axcio-input
                        px-3 py-2 pe-9
                        text-sm text-axcio-text
                        shadow-sm transition
                        focus:border-axcio-dark
                        focus:outline-none
                        focus:ring-2
                        focus:ring-axcio-dark/20
                        disabled:cursor-not-allowed
                        disabled:bg-axcio-input-disabled
                        disabled:text-axcio-text-muted
                        disabled:opacity-100
                        dark:border-axcio-border-dark
                        dark:bg-axcio-input-dark
                        dark:text-axcio-text-dark
                        dark:focus:border-axcio-light
                        dark:focus:ring-axcio-light/20
                        dark:disabled:bg-axcio-input-disabled-dark
                        dark:disabled:text-axcio-text-muted-dark
                    "
                    {% if field.required %}required{% endif %}
                    {% if field.disabled %}disabled{% endif %}
                >
                </select>
            </div>

            {% if field.allows_catalog_increment %}
                <button
                    type="button"
                    class="inline-flex h-10 w-10 shrink-0 items-center
                           justify-center rounded-lg border
                           border-axcio-dark bg-axcio-light
                           text-xl font-medium text-white
                           transition-colors
                           hover:bg-axcio-light-hover
                           focus:outline-none focus:ring-2
                           focus:ring-axcio-light
                           focus:ring-offset-2
                           dark:focus:ring-offset-axcio-page-dark"
                    title="Ajouter une valeur"
                    aria-label="Ajouter une valeur"
                    data-catalog-increment-button
                    data-catalog-code="{{ field.catalog_code }}"
                    data-target-field="{{ field.id_for_label }}"
                >
                    <span aria-hidden="true">+</span>
                </button>
            {% endif %}
        </div>

        {% if field.help_text %}
            <p
                class="text-xs text-axcio-text-muted
                       dark:text-axcio-text-muted-dark"
            >
                {{ field.help_text }}
            </p>
        {% endif %}
    </div>

{% endif %}
