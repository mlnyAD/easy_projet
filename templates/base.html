

{% load static %}

<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>
        {% block title %}Easy Projet{% endblock %}
    </title>

    <link
        rel="stylesheet"
        href="{% static 'dist/output.css' %}?v=5"
    >
</head>

<body class="min-h-screen bg-gray-50 text-gray-900
             dark:bg-neutral-950 dark:text-neutral-100">

    {% include "edf/notifications/toasts.html" %}

    <main>
        {% block content %}
        {% endblock %}
    </main>

    {% block scripts %}
        <script
            src="https://unpkg.com/lucide@latest"
            defer
        ></script>

        <script
            src="{% static 'js/forms/form_behaviors.js' %}?v=2"
            defer
        ></script>

        <script
            src="{% static 'js/forms/catalog_incremental.js' %}?v=3"
            defer
        ></script>

        <script
            src="{% static 'js/framework/toasts.js' %}?v=3"
            defer
        ></script>

        <script>
            document.addEventListener(
                "DOMContentLoaded",
                function () {
                    if (window.lucide) {
                        lucide.createIcons();
                    }
                }
            );
        </script>
    {% endblock %}

</body>
</html>
