

{% load static %}

<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <script>
        (function () {
            const storedTheme =
                localStorage.getItem("easy-projet-theme")
                || "system";

            const useDarkTheme =
                storedTheme === "dark"
                || (
                    storedTheme === "system"
                    && window.matchMedia(
                        "(prefers-color-scheme: dark)"
                    ).matches
                );

            document.documentElement.classList.toggle(
                "dark",
                useDarkTheme
            );
        })();
    </script>

    <title>
        {% block title %}
            Easy Projet
        {% endblock %}
    </title>

    <link
        rel="stylesheet"
        href="{% static 'dist/output.css' %}?v=7"
    >
</head>

<body class=ep-app-body">

    {% include "edf/notifications/toasts.html" %}

    <div class="ep-app">

        {% include "layout/sidebar.html" %}

        <div class="ep-app-main">

            {% include "layout/topbar.html" %}

            <main class="ep-main-content">
                {% block content %}
                {% endblock %}
            </main>

            {% include "layout/footer.html" %}

        </div>

    </div>

    {% block scripts %}

        <script
            src="https://unpkg.com/lucide@latest"
            defer
        ></script>

        <script
            src="{% static 'js/forms/form_behaviors.js' %}?v=2"
            defer
        ></script>

        <script
            src="{% static 'js/forms/catalog_incremental.js' %}?v=3"
            defer
        ></script>

        <script
            src="{% static 'js/framework/toasts.js' %}?v=3"
            defer
        ></script>

        <script
            src="{% static 'js/framework/sidebar.js' %}?v=1"
            defer
        ></script>

        <script
            src="{% static 'js/framework/form_collection.js' %}"
            defer
        ></script>

        <script
            src="{% static 'js/framework/theme.js' %}?v=1"
            defer
        ></script>

        <script>
            document.addEventListener(
                "DOMContentLoaded",
                function () {
                    if (window.lucide) {
                        lucide.createIcons();
                    }
                }
            );
        </script>

    {% endblock %}

</body>
</html>
