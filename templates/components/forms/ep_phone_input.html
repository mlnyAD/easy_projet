

<div class="space-y-1.5">
    {% if field.label %}
        <label
            for="{{ field.id_for_label }}"
            class="block text-sm font-medium text-gray-700"
        >
            {{ field.label }}

            {% if field.field.required %}
                <span
                    class="text-red-600"
                    aria-hidden="true"
                >
                    *
                </span>
            {% endif %}
        </label>
    {% endif %}

    {{ widget_html }}

    {% if field.help_text %}
        <p
            id="{{ field.auto_id }}_help"
            class="text-sm text-gray-500"
        >
            {{ field.help_text }}
        </p>
    {% endif %}

    {% if field.errors %}
        <div
            id="{{ field.auto_id }}_errors"
            class="space-y-1"
            role="alert"
        >
            {% for error in field.errors %}
                <p class="text-sm text-red-600">
                    {{ error }}
                </p>
            {% endfor %}
        </div>
    {% endif %}
</div>
