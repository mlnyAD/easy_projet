

<thead class="bg-gray-50 dark:bg-neutral-800">
    <tr>
        {% for column in list.columns %}
            {% if column.visible %}
                <th
                    scope="col"
                    data-column="{{ column.identifier }}"
                    class="px-6 py-3 text-left text-xs font-medium uppercase
                           tracking-wider text-gray-500 dark:text-neutral-400"
                >
                    {{ column.label }}
                </th>
            {% endif %}
        {% endfor %}

        {% if actions_template %}
            <th
                scope="col"
                data-column="actions"
                class="px-6 py-3 text-center text-xs font-medium uppercase
                       tracking-wider text-gray-500 dark:text-neutral-400"
            >
                Actions
            </th>
        {% endif %}
    </tr>
</thead>
