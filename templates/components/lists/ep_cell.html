

<td
    data-column="{{ cell.identifier }}"
    class="whitespace-nowrap px-6 py-2.5 text-sm"
>
    {% if cell.data_type == "boolean" %}

        {% if cell.value %}
            <span
                class="inline-flex rounded-full bg-green-100 px-2.5 py-1
                       text-xs font-medium text-green-800
                       dark:bg-green-900/40 dark:text-green-300"
            >
                Oui
            </span>
        {% else %}
            <span
                class="inline-flex rounded-full bg-gray-100 px-2.5 py-1
                       text-xs font-medium text-gray-700
                       dark:bg-neutral-700 dark:text-neutral-300"
            >
                Non
            </span>
        {% endif %}

    {% elif cell.data_type == "email" %}

        <a
            href="mailto:{{ cell.value }}"
            class="text-blue-600 hover:underline dark:text-blue-400"
        >
            {{ cell.display_value }}
        </a>

    {% elif cell.data_type == "phone" %}

        <a
            href="tel:{{ cell.value }}"
            class="text-blue-600 hover:underline dark:text-blue-400"
        >
            {{ cell.display_value }}
        </a>

    {% else %}

        <span class="text-gray-700 dark:text-neutral-300">
            {{ cell.display_value }}
        </span>

    {% endif %}

</td>
